name: Security and compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sekopinang_test
          MYSQL_ROOT_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.5.12'
          extensions: mbstring, pdo_mysql, pdo_sqlite, intl, zip
          coverage: none
          tools: composer:v2
          ini-values: session.upload_progress.enabled=0, fatal_error_backtraces=0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: php scripts/check-php-runtime.php
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer check-platform-reqs
      - run: composer audit --locked
      - run: npm ci --no-fund
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run build
      - name: Test with isolated database
        env:
          TEST_DATABASE: ${{ matrix.database }}
        run: |
          cp phpunit.xml phpunit.ci.xml
          if [ "$TEST_DATABASE" = mysql ]; then
            sed -i 's/name="DB_CONNECTION" value="sqlite"/name="DB_CONNECTION" value="mysql"/' phpunit.ci.xml
            sed -i 's/name="DB_DATABASE" value=":memory:"/name="DB_DATABASE" value="sekopinang_test"/' phpunit.ci.xml
          fi
          php vendor/phpunit/phpunit/phpunit --configuration phpunit.ci.xml --fail-on-warning --fail-on-deprecation
      - name: Verify production caches
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
        # Credentials below are for the ephemeral CI database only.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: test-only-password
