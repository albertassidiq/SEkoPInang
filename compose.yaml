name: sekopinang

services:
  app:
    image: ${APP_IMAGE:-sekopinang:local}
    build:
      context: .
      target: production
    restart: unless-stopped
    init: true
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?Set the existing APP_KEY in .env.docker}
      LOG_CHANNEL: stderr
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080'
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - app-storage:/var/www/html/storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  app-storage:
    name: ${APP_STORAGE_VOLUME:-sekopinang-storage}
